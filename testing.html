<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AssessmentEcosystem</title>
  <style>
    body {
      background-color: #c11a1a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin-top: 100px;
      font-family: Arial, sans-serif;
    }

    .button {
      font-size: 2rem;
      box-shadow: 0px 0px aqua;
      border-radius: 12px;
      background-color: aqua;
      padding: 10px 20px;
      width: 150px;
      text-align: center;
      cursor: pointer;
      border: none;
    }

    .button:hover {
      box-shadow: 0 0 10px white;
    }

    h1 {
      color: white;
    }
  </style>
</head>
<body>
  <h1>Hey man click the button here</h1>
  <button id="button" class="button">0</button>

  <script>
    let counter = 0;
    const button = document.getElementById("button");

    button.addEventListener('click', () => {
      console.log("Button clicked!");
      counter++;
      button.textContent = counter;
    });
  </script>
</body>
</html>
